<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>层合固化证据台</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#111c33; --line:#263653; --text:#e5eefc; --muted:#94a3b8; --ok:#22c55e; --bad:#f87171; --warn:#f59e0b; --info:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:28px 32px 18px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,#101827,#172554); }
    h1 { margin:0 0 8px; font-size:30px; }
    main { padding:24px 32px 40px; display:grid; gap:18px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; overflow:auto; }
    .span7 { grid-column:span 7; } .span5 { grid-column:span 5; } .span12 { grid-column:span 12; } .span4{grid-column:span 4}.span8{grid-column:span 8}
    h2 { margin:0 0 14px; font-size:18px; } h3 { margin:14px 0 8px; font-size:15px;color:#bfdbfe; }
    .muted { color:var(--muted); font-size:13px; line-height:1.6; }
    .pill { display:inline-block; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; }
    .PASS,.CONFORMING { background:rgba(34,197,94,.15); color:#86efac; border:1px solid rgba(34,197,94,.35); }
    .FAIL,.NONCONFORMING { background:rgba(248,113,113,.15); color:#fca5a5; border:1px solid rgba(248,113,113,.35); }
    .OPEN,.pending { background:rgba(245,158,11,.15); color:#fcd34d; border:1px solid rgba(245,158,11,.35); }
    table { width:100%; border-collapse:collapse; font-size:13px; } th,td { border-bottom:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; } th { color:#bfdbfe; }
    button { background:#2563eb; color:white; border:0; border-radius:10px; padding:8px 11px; cursor:pointer; font-weight:700; } button.secondary{background:#334155}.small{padding:5px 8px;font-size:12px}
    input,textarea,select { width:100%; background:#0b1220; color:var(--text); border:1px solid #334155; border-radius:10px; padding:9px; margin:6px 0; }
    textarea { min-height:70px; resize:vertical; }
    .rule { border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; background:#0b1426; }
    .range { border-left:3px solid var(--warn); padding:6px 9px; margin:6px 0; background:rgba(245,158,11,.08); font-size:12px; }
    .segment { border-left:3px solid var(--info); padding:6px 9px; margin:6px 0; background:rgba(56,189,248,.08); font-size:12px; }
    img { width:100%; border-radius:12px; background:#0f172a; }
    .topline { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    code { color:#bae6fd; }
  </style>
</head>
<body>
<header>
  <h1>层合固化证据台</h1>
  <div id="summary" class="muted">正在载入固定 fixture...</div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="load()">重放</button>
    <a href="/api/export"><button type="button" class="secondary">导出运行记录</button></a>
    <button type="button" class="secondary" onclick="resetData()">清空并重新导入</button>
  </div>
</header>
<main>
  <section class="grid">
    <div class="card span8"><h2>铺层堆叠与材料方向</h2><img id="stackSvg" alt="铺层堆叠 SVG"></div>
    <div class="card span4"><h2>炉程阶段</h2><div id="stages"></div></div>
  </section>
  <section class="grid">
    <div class="card span8"><h2>热电偶曲线与共同允许带</h2><img id="thermalSvg" alt="热电偶曲线 SVG"><p class="muted">175°C 与 185°C 的样本按闭区间判合格；保温只从全部当前必需热电偶同时合格后开始。</p></div>
    <div class="card span4"><h2>传感器与操作</h2><div id="events"></div></div>
  </section>
  <section class="grid">
    <div class="card span4"><h2>部件控制点</h2><div id="points"></div></div>
    <div class="card span8"><h2>规则证据区间与失败时间范围</h2><div id="rules"></div></div>
  </section>
  <section class="grid">
    <div class="card span5"><h2>建立偏差处理分支</h2>
      <select id="ruleId"></select><input id="deviationTitle" placeholder="标题，例如：共同保温不足偏差"><textarea id="deviationDescription" placeholder="处置依据、风险评估和复证人"></textarea>
      <button onclick="createDeviation()">建立分支</button><div id="deviations" style="margin-top:12px"></div>
    </div>
    <div class="card span7"><h2>操作审计与运行记录</h2><div id="actions"></div></div>
  </section>
</main>
<script>
let state;
async function api(path, options) { const response = await fetch(path, options); state = await response.json(); render(); }
async function load(){ await api('/api/bench'); }
function post(path, body) { return api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {actor:'本地复核员'})}); }
function shortTime(value){ return value ? value.substring(11,16) : '—'; }
function esc(value){ return String(value ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  document.getElementById('stackSvg').src = '/api/stack.svg?t=' + Date.now();
  document.getElementById('thermalSvg').src = '/api/chart.svg?t=' + Date.now();
  const r = state.run, e = state.evaluation;
  document.getElementById('summary').innerHTML = `${esc(r.partName)} · ${esc(r.id)} · 规范 <code>${esc(r.specVersion)}</code> · fixture <code>${esc(r.fixtureVersion)}</code> · 结论 <span class="pill ${e.overallStatus}">${e.overallStatus}</span><br>${esc(r.inputSummary)}`;
  document.getElementById('stages').innerHTML = '<table><tr><th>阶段</th><th>时间</th><th>阈值</th></tr>' + state.stages.map(s => `<tr><td>${esc(s.label)}</td><td>${shortTime(s.startAt)}-${shortTime(s.endAt)}</td><td>${s.minC??''}${s.maxC?'-'+s.maxC+'°C':''} ${s.requiredHoldSeconds? s.requiredHoldSeconds+'s':''} ${s.minVacuumKpa?'真空≥'+s.minVacuumKpa:''} ${s.minPressureKpa?'压力≥'+s.minPressureKpa:''}</td></tr>`).join('') + '</table>';
  document.getElementById('points').innerHTML = state.controlPoints.map(p => `<div class="rule"><b>${esc(p.code)} · ${esc(p.label)}</b><br><span class="muted">${p.required?'必需控制点':'辅助点'} · ${p.selected?'当前选择':'未选择'}</span><br><button class="small" onclick="post('/api/control-points/${p.id}/select')">选择此控制点</button></div>`).join('');
  const entries = Object.fromEntries(state.sensorEntries.map(entry => [entry.sensorId, entry.firstInBandAt]));
  document.getElementById('events').innerHTML = state.sensors.map(sensor => `<div class="rule"><b>${esc(sensor.id)} · ${esc(sensor.location)}</b><br><span class="muted">首次进入允许带：${shortTime(entries[sensor.id])}</span></div>`).join('') + state.sensorEvents.map(ev => `<div class="rule"><b>${esc(ev.eventType)}</b> · ${shortTime(ev.eventAt)}<br><span class="muted">${esc(ev.sensorId)}：${esc(ev.detail)}</span><br><span class="pill ${ev.confirmed?'PASS':'OPEN'}">${ev.confirmed?'已确认 '+esc(ev.confirmedBy):'待确认'}</span><br><button class="small" onclick="post('/api/sensor-events/${ev.id}/confirm')">确认传感器记录</button></div>`).join('');
  document.getElementById('ruleId').innerHTML = state.evaluation.rules.map(rule => `<option value="${rule.ruleId}">${esc(rule.label)} · ${rule.status}</option>`).join('');
  document.getElementById('rules').innerHTML = state.evaluation.rules.map(rule => `<div class="rule"><div class="topline"><b>${esc(rule.label)}</b><span class="pill ${rule.status}">${rule.status}</span></div><div class="muted">${esc(rule.detail)}<br>证据区间：${rule.evidenceStart?shortTime(rule.evidenceStart)+' - '+shortTime(rule.evidenceEnd):'无'}</div>${rule.failureRanges.map(f => `<div class="range">失败：${shortTime(f.start)}-${shortTime(f.end)} · ${esc(f.label)}</div>`).join('')}${rule.segments.map(s => `<div class="segment">证据：${shortTime(s.start)}-${shortTime(s.end)} · ${s.durationSeconds}s · ${esc(s.label)}</div>`).join('')}</div>`).join('');
  document.getElementById('actions').innerHTML = '<table><tr><th>时间</th><th>操作</th><th>目标</th><th>说明</th></tr>' + state.actions.map(a => `<tr><td>${shortTime(a.createdAt)}</td><td>${esc(a.actionType)}</td><td>${esc(a.targetId)}</td><td>${esc(a.note)}</td></tr>`).join('') + '</table>';
  document.getElementById('deviations').innerHTML = state.deviations.map(d => `<div class="range"><b>${esc(d.id)} ${esc(d.title)}</b><br>${esc(d.description)}<br><span class="pill OPEN">${esc(d.status)}</span></div>`).join('');
}
function createDeviation(){ post('/api/deviations', {ruleId:ruleId.value,title:deviationTitle.value||'偏差处理分支',description:deviationDescription.value||'待工程处置',actor:'本地复核员'}); deviationTitle.value=''; deviationDescription.value=''; }
function resetData(){ if(confirm('将删除 SQLite 当前数据并重新导入固定 fixture，是否继续？')) post('/api/reset'); }
load();
</script>
</body>
</html>
